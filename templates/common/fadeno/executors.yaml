# Fadeno's model registry and harness table.
#
# A dial names WHO runs an archetype — a model, an optional effort, and
# optionally WHICH HARNESS runs it. It never names a lane, a driver, or an
# argv. The HOST harness (the one Fadeno is invoked inside) is discovered at
# dispatch time from ambient signals, never from stored state. At dispatch time
# the pair (dial harness, host) plus policy resolves the delivery: same harness
# runs in-session, a different one spawns that harness's CLI, and policy
# adjusts (an effort pin the host cannot carry, eligibility, shadow pairs,
# locked run snapshots).
#
# User ~/.config/fadeno/executors.yaml and project .fadeno/executors.yaml may
# extend or override these names under the same layering rules.
#
# Dials select the model per archetype: `fadeno dial worker grok`,
# `fadeno dial judge sol@xhigh --harness opencode`, `fadeno dial clear worker`.
# A bare model name resolves at its registry-standard effort on its home
# harness. A repo can pin archetypes it has opinions about:
#
#   dials:
#     judge: sol
#
# The cascade is: binding → session dial → repo pin → user dial → host-native
# base (current-host). There are no named presets.
schema_version: 4

models:
  luna:
    provider: openai
    id: gpt-5.6-luna
    effort: xhigh
  terra:
    provider: openai
    id: gpt-5.6-terra
    effort: xhigh
  sol:
    provider: openai
    id: gpt-5.6-sol
    effort: high
  astra:
    provider: openai
    id: gpt-6-astra
    effort: medium
  opus:
    provider: anthropic
    id: opus
    effort: xhigh
    # Keyed by HARNESS: the id THIS harness's CLI must be handed for this
    # model — `-m anthropic/claude-opus-4.8` for OpenCode, where the canonical
    # `opus` means nothing. One id per harness that needs a different one.
    spellings:
      opencode: anthropic/claude-opus-4.8
  fable:
    provider: anthropic
    id: fable
    effort: high
  sonnet:
    provider: anthropic
    id: sonnet
    effort: xhigh
  grok:
    provider: xai
    id: grok-4.6
    effort: xhigh
  gemini:
    provider: google
    # `high`, not `xhigh`, and this is a correctness fix rather than a taste
    # one. The google harness sets `effort_encoding: model-suffix`, so the
    # dial's effort is appended to the id — and Antigravity publishes only
    # `-high|-medium|-low`. A bare `fadeno dial judge gemini` therefore built
    # `gemini-3.7-flash-xhigh`, which agy rejects with exit 1 after printing
    # its model list. Found by dogfood 2026-08-21: the default was unusable.
    id: gemini-3.7-flash
    effort: high
  muse:
    provider: muse
    id: muse-spark-1.2-contributor
    effort: xhigh
# A model may also name a non-home harness explicitly with `harness: <id>`;
# the harness-facing id then goes in `spellings.<harness>`. That is what
# `fadeno model add` writes when a model's delivery is not its provider's home.

# One table, keyed by harness id. A harness is a HOST (Fadeno can run inside
# it) when it declares `host:`, and an EXECUTOR (Fadeno can spawn it) when it
# declares `command:`; most are both. `provider:` claims a provider as home, so
# models of that provider default to this harness — exactly one harness may
# claim a given provider.
#
# This replaced six near-identical `routes.<host>` tables. Their only real
# difference was which entry carried `host: true`, and that bit is exactly
# "dial harness == host harness" — a question about the call, not about the
# catalog, so it is answered at dispatch time instead of stored six times.
#
# `eligibility:` sits on the LANE it constrains: on `host:` for the in-session
# lane, at harness level for the base `command:` lane, and inside a variant for
# that variant. A variant does not inherit the base lane's eligibility — it is
# a different argv with different capabilities, which is the whole reason it
# has its own name. Eligibility merges with the model's, strictest wins, and is
# structural: it covers unregistered models falling through to the lane too.
harnesses:
  claude:
    provider: anthropic
    host:
      # Claude's Agent tool has no effort channel at all, so a pinned effort
      # cannot be materialized into a host slot: it selects the LANE instead
      # (`decideLane`), and `fadeno steering apply` writes no host agent file.
      effort_channel: none
      # The relay: the model that reads a resolver answer and forwards a
      # delivery, doing none of the role work itself. Per harness because a
      # relay must be a model that harness's own provider already serves. Not
      # an archetype — it carries no policy the kernel enforces, and listing it
      # in `fadeno dial` would imply it is work to be dialed. Absent for a
      # harness = keep the caller's built-in default.
      #
      # These are dogfood receipts, not guesses. 2026-08-12 A/B: haiku broke
      # the relay contract — it summarized deliveries instead of relaying them
      # verbatim, answered from the prompt's first line, and asserted evidence
      # it had not written. sonnet and luna each held it. Raise a value here
      # only against a comparable run; a relay that paraphrases silently
      # corrupts every dispatch.
      #
      # Claude's proxies inherit session effort (no effort channel), so a pin
      # here would be inert — model only.
      relay: sonnet
      # An in-session Claude agent cannot spawn subagents, so it cannot
      # coordinate; a director delivered here would do the work itself.
      eligibility: { director: forbidden }
    # `--dangerously-skip-permissions` is Claude Code's headless-approval flag,
    # and it sits here for the same reason every other vendor's command lane
    # carries its own: codex has
    # `--dangerously-bypass-approvals-and-sandbox`, grok `--always-approve`,
    # agy `--dangerously-skip-permissions`, opencode `--auto`, muse
    # `--trust-workspace --disable-approval --user-input-auto-resolve`.
    #
    # It replaced `--permission-mode acceptEdits --allowedTools Bash` on
    # 2026-09-06. That pair auto-approved file edits and Bash and nothing else,
    # and an unresolved permission request is DENIED by a headless `-p` run
    # rather than left pending — so any tool outside that pair was a silent
    # denial mid-assignment, which is the same failure the codex sandbox
    # produced for SSH. Every user of this project runs their own host in yolo
    # mode; a command lane that is stricter than the host that spawned it buys
    # nothing and costs whole assignments.
    #
    # `--allowedTools` is not a smaller version of this flag, which is why no
    # amount of widening the rule list was the fix. Every rule it takes is an
    # allow-list entry, so the argv has to enumerate in advance every tool the
    # assignment will turn out to need; whatever the list omits is denied
    # silently, and the failure surfaces as an agent that stopped rather than as
    # a permission error. `argvGrantsFadenoShell` (src/lib/executors.ts) still
    # reads the flag, because a user or project catalog may pin it — but nothing
    # shipped here writes it.
    #
    # Be honest about what that buys and what it costs. There is no OS sandbox
    # anywhere in this argv: Claude Code's permission layer is the only gate and
    # this opens it. The containment is the isolated worktree, which contains
    # FILE writes and nothing else — a spawned claude can still reach the
    # network, a package registry, and any credential in the environment. Side
    # effects outside the worktree are uncontained, exactly as they already are
    # for the five lanes above and below. A project that wants a tighter posture
    # declares its OWN variant, with its own name and its own restricting flags,
    # and lets policy or an explicit `--harness` reach it — see the permissions
    # note at the bottom of this file.
    command: [ claude, -p, --model, "{model}", --dangerously-skip-permissions ]
    # No longer a capability claim — the `exec` variant below is the SAME argv,
    # so both claude lanes can run `fadeno`. What this block still does is make
    # a director resolve to a NAMED lane: the base lane forbids the archetype,
    # policy falls through to the first variant that does not, and the ledger
    # row and run snapshot then record `variant: exec`. That is how a reader
    # tells a director dispatch from a worker dispatch that ran the identical
    # command. Drop it and `director` silently becomes an unnamed base-lane
    # delivery.
    eligibility: { director: forbidden }
    variants:
      # The lane a director takes — and, since the base lane opened its shell,
      # nothing more than that. Its argv is byte-identical to the base lane's;
      # the variant grants no capability the base lane lacks, it only carries
      # the `director` eligibility the base lane withholds. Keep the two argvs
      # identical (a test asserts it); if they ever have to diverge, the reason
      # goes in this comment. Chosen by POLICY, never named on a dial. (Was the
      # `anthropic-exec` route / `--via claude-exec`.)
      exec:
        command: [ claude, -p, --model, "{model}", --dangerously-skip-permissions ]
  codex:
    provider: openai
    host:
      # A Codex agent TOML carries `model_reasoning_effort`, so a pinned effort
      # CAN be materialized: `fadeno steering apply` writes the host agent file
      # and a fresh session then delivers in-session at the pin.
      effort_channel: agent-file
      # Codex bakes both model and effort into the broker TOML, so effort is
      # pinned here rather than left at luna's xhigh registry default.
      #
      # Raised low -> high 2026-08-20. Unlike the model choice above, this is a
      # judgment call and not a receipt: luna is cheap enough that the broker's
      # few relay tokens are not worth optimizing, and the broker's contract is
      # not one instruction but a branch table (engine vs ordinary delivery,
      # then command / host / restart_required / write_conflict) that it must
      # route correctly every time. Raising effort on a model that ALREADY held
      # the relay contract moves in the safe direction, which is why it does
      # not need the A/B the rule above demands -- that rule guards changing
      # WHO relays.
      #
      # The failure mode to watch is the opposite of haiku's: a more capable
      # broker is likelier to decide it can just do the work itself. Its
      # instructions forbid that in every branch. If a broker is ever observed
      # doing role work instead of dispatching, suspect this line first.
      relay: luna@high
    # `--dangerously-bypass-approvals-and-sandbox` is codex's headless-approval
    # flag, and it replaced `--sandbox workspace-write` on 2026-09-06 after that
    # sandbox blocked a worker outright. A Tokyo benchmark worker needed SSH to
    # a remote host; the host's own SSH succeeded through escalation and the
    # command-lane worker's returned `Operation not permitted`, twice, so the
    # assignment could not run at all. `--approve-for-me` was considered and
    # rejected: an approval request has nobody to answer it in a headless
    # `codex exec`, so it resolves to a denial with extra steps.
    #
    # This also ENDS an inconsistency. Every other lane in this file carries a
    # headless-approval flag and no OS sandbox — the note at the bottom says so
    # outright — while codex alone carried a real kernel sandbox. So "side
    # effects outside the worktree are uncontained, exactly as for the lanes
    # above and below" was true of five lanes and false of this one, and the
    # one it was false about is the one people hit.
    command: [ codex, exec, --model, "{model}", --dangerously-bypass-approvals-and-sandbox, -c, 'model_reasoning_effort="{reasoning_effort}"', "-" ]
  grok:
    provider: xai
    host:
      effort_channel: none
      # A Grok Build session cannot spawn a subagent that coordinates through
      # fadeno, so a director delivered in-session would do the work itself.
      eligibility: { director: forbidden }
    # `--always-approve` is the headless-approval flag.
    command: [ grok, --prompt-file, /dev/stdin, --model, "{model}", --reasoning-effort, "{reasoning_effort}", --always-approve ]
    models_command: [ grok, models ]
    # Harness-level, so it holds on the COMMAND lane too, and for the same
    # reason as the host block above: a spawned `grok` cannot dispatch back
    # through fadeno either, so a director sent here would coordinate nothing.
    # Stated twice because the two maps are merged per key — the host lane may
    # relax what the harness forbids, and silence here would have let it.
    eligibility: { director: forbidden }
  # google → Antigravity (`agy`). Executor only: Fadeno spawns it, never runs
  # inside it. NOT gemini-cli: that client is retired for individuals and dies
  # at auth with "IneligibleTierError", pointing at Antigravity as its
  # replacement.
  #
  # Three things here are load-bearing, each verified live 2026-08-13, and each
  # of the two rejected spellings fails by exiting 0 having done nothing:
  #
  #   1. No `-p`. `agy -p` requires a value, and `agy -p -` does NOT read
  #      stdin — it takes "-" as the literal prompt and answers "How can I help
  #      you today?" with exit 0. Piping stdin with no `-p` is the spelling
  #      that actually delivers the prompt.
  #   2. `--new-project` binds the workspace to the current directory. Without
  #      it, agy has no active workspace and silently writes to
  #      ~/.gemini/antigravity-cli/scratch/ instead of the repo — reporting "I
  #      have created the file" and exiting 0 while the repo gets nothing.
  #      `--add-dir .` does NOT fix this (only an absolute path does, which a
  #      static command cannot express), so `--new-project` is the one spelling
  #      that works from argv alone.
  #   3. No effort flag. `--effort` only accepts low|medium|high, so passing
  #      {reasoning_effort} would hard-fail every target left at the `default`
  #      effort. Antigravity encodes effort in the model id instead, which is
  #      what `effort_encoding: model-suffix` below says.
  #
  # `--dangerously-skip-permissions` is the headless-approval case documented
  # for grok above. Verified end to end: prompt on stdin, exit 0, report on
  # stdout, and a file actually written into the repo.
  # A 2026-08-16 read probe of `--mode plan --sandbox` blocked mutation, but the
  # denied tool made headless agy exit 0 with no report. That violates the
  # executor contract, so Antigravity honestly remains write-only until its
  # headless permission surface can both deny the write and return the
  # requested report.
  agy:
    provider: google
    command: [ agy, --model, "{model}", --new-project, --dangerously-skip-permissions, --output-format, text ]
    models_command: [ agy, models ]
    effort_encoding: model-suffix
    eligibility: { director: forbidden }
  # OpenCode: the universal adapter — home to no provider, and able to run
  # anyone through `spellings`. Also a HOST (promoted from executor-only on
  # 2026-08-22): role work is delivered by OpenCode's own subagents
  # (.opencode/agents). `--variant` is OpenCode's reasoning-effort dial and
  # accepts `default` as well as high/max/minimal, so {reasoning_effort}
  # substitutes safely. `--auto` is its headless approval flag.
  opencode:
    host:
      effort_channel: none
      # `session`, not `model`: the OpenCode plugin's rewrite sets only the
      # agent NAME (`applyRewrite` → `subagent_type`), so a dialed model handed
      # to a host spawn here would be silently ignored. So only `current-host`
      # — the session's own identity — takes the host lane; a named model on
      # `opencode` is a command delivery. That is exactly what v3 expressed by
      # putting `host: true` on `routes.opencode.current-host` alone.
      identity: session
      # An in-session OpenCode subagent cannot coordinate through fadeno.
      eligibility: { director: forbidden }
    command: [ opencode, run, -m, "openrouter/{model}", --variant, "{reasoning_effort}", --auto ]
    models_command: [ opencode, models ]
    # The OpenRouter listing includes `openrouter/`; the `-m` argument must not
    # receive that prefix twice, so it is declared here rather than inlined.
    models_prefix: "openrouter/"
    eligibility: { director: forbidden }
    variants:
      # A model served directly by OpenCode rather than through OpenRouter —
      # no prefix on `-m`. (Was the `opencode-direct` route.)
      direct:
        command: [ opencode, run, -m, "{model}", --variant, "{reasoning_effort}", --auto ]
        # Same argv capability as the base lane, so the same block: a spawned
        # `opencode run` cannot run the fadeno command family either.
        eligibility: { director: forbidden }
  # muse → Muse Code (`muse exec`). Executor only. Verified live 2026-08-16;
  # three spellings REJECTED before this one: `--prompt-file /dev/stdin` ("not
  # a regular file"), bare stdin ("missing prompt"), and `--prompt-file -`
  # (literal filename) — Muse Code reads prompts only from a regular file, so
  # the command uses the {prompt_file} placeholder: the kernel substitutes its
  # attested prompt snapshot's absolute path at spawn (the digest then attests
  # exactly the bytes the executor reads). `--workspace .` verified to root
  # tools at the spawn cwd (banner: "workspace root: . (explicit)"); a write
  # landed in-place. `--reasoning-effort` accepts
  # none|minimal|low|medium|high|xhigh|ultra — NOT `default`, so an
  # unregistered model forced onto this harness fails loudly at the CLI.
  # `--trust-workspace --disable-approval --user-input-auto-resolve` is the
  # headless-approval trio (finer-grained than `--yolo`: the OS sandbox stays
  # on). Stdout is the report; banners go to stderr. No models listing
  # subcommand — no dial-time probe. Engine repair re-asks travel on stdin,
  # which file-reading executors ignore — a muse-dialed actor re-runs its
  # recorded prompt instead (known limitation).
  # A live probe with `--disable-write --disable-shell` read the workspace, was
  # physically denied the write tool, and still returned a report — so a
  # restricted muse lane genuinely works. It is not the default: a restriction
  # is its own named variant, spelled out in its own command, never a second
  # argv hidden beside this one.
  muse:
    provider: muse
    command: [ muse, exec, --provider, meta, --model, "{model}", --reasoning-effort, "{reasoning_effort}", --prompt-file, "{prompt_file}", --workspace, ".", --trust-workspace, --disable-approval, --user-input-auto-resolve, --no-session-log ]
    eligibility: { director: forbidden }
  # omp is a native host with the same role-agent/task surface as OpenCode.
  # Host only today: Fadeno runs inside it, and there is no headless omp CLI to
  # spawn, so a dial that names `omp` from any other host answers
  # `restart_required` rather than inventing a command.
  omp:
    host:
      effort_channel: none
      # Same as OpenCode: the omp extension's rewrite sets only `agent`, so a
      # dialed model cannot reach a host spawn. Only `current-host` is host-
      # delivered here. (v3: `host: true` on `routes.omp.current-host` alone.)
      identity: session

# Permissions: every command above is the PERMISSIVE argv for its vendor, and
# that is deliberate. Fadeno enforces nothing itself — a `write_access:` key
# was only ever a claim in YAML that nothing checked, and the machinery that
# matched such claims against archetype demands produced four distinct
# silent-wrong-answer defects before it was removed. Enforcement belongs to
# the vendor flags you can read in the argv (`--sandbox`, `--permission-mode`,
# `--allowedTools`, `--disable-shell`), and containment belongs to isolated
# worktrees, which are now the default for command dispatches. Worktrees
# contain FILE writes; they are not a sandbox, and no lane above claims one.
#
# As of 2026-09-06 every lane carries its vendor's HEADLESS-APPROVAL flag and
# no lane carries a restricting one. That is a deliberate posture, not an
# oversight: every user of this project drives their own host in yolo mode,
# and a command lane stricter than the host that spawned it adds no safety —
# it converts a permitted action into a mid-assignment denial. Codex's
# `--sandbox workspace-write` was the last holdout and it cost two Tokyo runs
# that needed SSH, twice returning `Operation not permitted` for a worker
# while the host's own SSH succeeded.
#
# To run something restricted, declare it as its OWN variant with its own name
# (e.g. a `sandboxed` variant with `--sandbox read-only`) and let policy or an
# explicit `--harness` reach it. A restriction spelled out in an argv is one a
# reader can see; a restriction carried in metadata is one nobody knows about.
#
# `requires_write:`, `write_variant:`, `routes:`, `relay:`, `driver:`,
# `host: true`, `delivery:` and `unregistered_model_driver:` are REMOVED and
# now error at load. See docs/experimental/harness-neutral-dials.md and
# docs/experimental/permissions-and-isolation.md before reintroducing anything
# of that shape.
# `scout` is divergent artifact-producing work that must not mutate the
# workspace. It is its own archetype: undialed it resolves to the host-native
# base (current-host) like any other, never through another archetype's dial.
# (`fallback` remains available for custom archetypes: binding-only — an
# archetype without a dial resolves through its fallback's binding, never its
# policy.)
# `director` is high-level planning/orchestration delegated to a (usually
# cheaper) model: it decomposes a side task and coordinates workers/reviewers
# itself, via the fadeno CLI. That means it needs an argv that can actually run
# `fadeno`. Every claude lane can (`--dangerously-skip-permissions`), as can
# codex (`--dangerously-bypass-approvals-and-sandbox`); anthropic directors
# still land on the `exec` variant, but for NAMING — the base lane declares
# `eligibility: { director: forbidden }` so the delivery is recorded as
# `variant: exec` — not because the base lane is incapable. Nothing enforces
# this: check the command, not a declaration. The predicate that READS these
# argvs for the `fadeno models` `fadeno_capable` column is
# `argvGrantsFadenoShell`; it knows both vocabularies, and a new harness whose
# lane spells approval some third way must be taught there or the column will
# quietly answer `false` for it.
# The canonical archetypes. The set is open: add your own entry here with a
# `description:` and a director will know when to reach for it. A description
# is what a director reads when choosing what to spawn next, so write it as
# the sentence that tells one archetype from another.
archetypes:
  worker:
    description: Implements a described change in its own worktree, commits it on its branch, and reports what the tree holds.
  reviewer:
    description: Reviews a change, diff, or artifact for correctness, edge cases, safety, and tests; reports findings and changes nothing.
  judge:
    description: Evaluates and scores candidate attempts or artifacts against stated criteria and picks a winner.
  scout:
    description: Explores and reports; searches code and documents, gathers facts, produces a summary, and changes nothing.
  director:
    description: Coordinates a whole task; decomposes it, spawns the other archetypes, integrates their work, and reports. Never does the work itself.

# Where a model nobody registered goes. Its id is passed verbatim, so this must
# name a harness that can accept an arbitrary id — OpenCode via OpenRouter.
unregistered_model_harness: opencode

# Deterministic tool registry for `tool_call` steps (Priority 7 frozen contract).
# `tool:` in a playbook is a logical capability name, never shell. Each name
# must be bound here as a static argv array with optional positive timeout.
# No shell is inserted: argv runs directly. An entry may explicitly name a shell
# such as [sh, -c, "…"] — that is the operator's explicit choice, not Fadeno's.
# No interpolation (`{`, `}`, `$`, backtick are rejected — this is a literal
# argv, not a template). Only ready `tool_call` steps whose output schema is
# `test-result` are automated via `fadeno tool-run`; Diff and other typed
# outputs remain manual via `fadeno tool-complete`.
#
# Layering follows the same precedence as executors: project
# `.fadeno/executors.yaml` overrides user `~/.config/fadeno/executors.yaml`
# which overrides this shipped default, except a self-contained project catalog
# with its own `models:` + `harnesses:` suppresses the builtin and user layers
# entirely (see src/lib/config-layers.ts:projectIsComplete). Snapshotted per
# run into `profile.yaml`; verification recomputes command_sha256 against that
# snapshot.
tools:
  # Example (matches starter playbooks — `tool: test_runner`):
  # test_runner:
  #   command: [npm, test]
  #   timeout_ms: 300000
  # # or timeout in seconds:
  # # test_runner:
  # #   command: [npm, test]
  # #   timeout: 300
