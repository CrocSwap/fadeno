# Fadeno's harness-neutral executor catalog. Loadouts select model targets;
# routes decide how the active harness delivers each provider (native or command).
# User ~/.config/fadeno/executors.yaml and project .fadeno/executors.yaml may
# extend or override these names.
schema_version: 2

targets:
  current-host:
    provider: current-host
    model: current-host
    reasoning_effort: default
  luna-medium:
    provider: openai
    model: gpt-5.6-luna
    reasoning_effort: medium
  terra-medium:
    provider: openai
    model: gpt-5.6-terra
    reasoning_effort: medium
  sol-high:
    provider: openai
    model: gpt-5.6-sol
    reasoning_effort: high
  claude-default:
    provider: anthropic
    model: opus
    reasoning_effort: high
  grok-default:
    provider: xai
    model: grok
    reasoning_effort: high

routes:
  codex:
    current-host:
      native: true
    openai:
      native: true
      command: [codex, exec, --model, "{model}", --sandbox, workspace-write, -c, 'model_reasoning_effort="{reasoning_effort}"', "-"]
    anthropic:
      command: [claude, -p, --model, "{model}"]
    xai:
      command: [grok, build, "-"]
  claude:
    current-host:
      native: true
    anthropic:
      native: true
      command: [claude, -p, --model, "{model}"]
    openai:
      command: [codex, exec, --model, "{model}", --sandbox, workspace-write, -c, 'model_reasoning_effort="{reasoning_effort}"', "-"]
    xai:
      command: [grok, build, "-"]
  grok:
    current-host:
      native: true
    xai:
      native: true
      command: [grok, build, "-"]
    openai:
      command: [codex, exec, --model, "{model}", --sandbox, workspace-write, -c, 'model_reasoning_effort="{reasoning_effort}"', "-"]
    anthropic:
      command: [claude, -p, --model, "{model}"]
  standalone:
    current-host:
      native: true
    openai:
      command: [codex, exec, --model, "{model}", --sandbox, workspace-write, -c, 'model_reasoning_effort="{reasoning_effort}"', "-"]
    anthropic:
      command: [claude, -p, --model, "{model}"]
    xai:
      command: [grok, build, "-"]

loadouts:
  native:
    worker: current-host
    reviewer: current-host
    judge: current-host
  luna:
    worker: luna-medium
    reviewer: luna-medium
    judge: luna-medium
  terra:
    worker: terra-medium
    reviewer: terra-medium
    judge: terra-medium
  sol:
    worker: sol-high
    reviewer: sol-high
    judge: sol-high
  codex:
    worker: terra-medium
    reviewer: terra-medium
    judge: sol-high
  claude:
    worker: claude-default
    reviewer: claude-default
    judge: claude-default
  grok-worker:
    worker: grok-default
    reviewer: terra-medium
    judge: sol-high

default_loadout: native

# Direct bindings remain available for repo-native compatibility. Loadout
# slots win for archetyped roles; an explicit role binding still wins first.
bindings:
  "*": current-host
