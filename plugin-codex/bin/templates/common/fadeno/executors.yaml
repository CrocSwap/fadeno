    # task — planning included — to a cheaper claude (`fadeno dial director
    # opus --via claude-exec`): the write variant can edit AND run the fadeno
    # command family (scoped Bash grant, nothing wider), so a dispatched
    # director can coordinate workers/reviewers itself.
    anthropic-exec:
      driver: claude-exec
      command: [claude, -p, --model, "{model}"]
      timeout_ms: 1200000
      write_access: false
      write_variant:
        command: [claude, -p, --model, "{model}", --permission-mode, acceptEdits, --allowedTools, "Bash(fadeno:*)"]
    openai:
      driver: codex
      command: [codex, exec, --model, "{model}", --sandbox, read-only, -c, 'model_reasoning_effort="{reasoning_effort}"', "-"]
      timeout_ms: 1200000
      write_access: false
      write_variant:
        command: [codex, exec, --model, "{model}", --sandbox, workspace-write, -c, 'model_reasoning_effort="{reasoning_effort}"', "-"]
    xai:
      driver: grok
      command: [grok, --prompt-file, /dev/stdin, --model, "{model}", --reasoning-effort, "{reasoning_effort}", --sandbox, read-only, --always-approve]
      timeout_ms: 1200000
