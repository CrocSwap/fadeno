# Fadeno's bundled executor catalog. This is intentionally conservative:
# native is the safe default and command adapters are only used after an
# explicit loadout selection. User ~/.config/fadeno/executors.yaml and a
# project .fadeno/executors.yaml may override entries by name.
executors:
  native-worker:
    adapter: host
    model: current-host
    reasoning_effort: default
    agent_type: worker
  native-reviewer:
    adapter: host
    model: current-host
    reasoning_effort: default
    agent_type: reviewer
  native-judge:
    adapter: host
    model: current-host
    reasoning_effort: default
    agent_type: judge
  luna-worker:
    adapter: host
    model: gpt-5.6-luna
    reasoning_effort: medium
    agent_type: worker
    fallback_command: [codex, exec, --model, gpt-5.6-luna, --sandbox, workspace-write, -c, 'model_reasoning_effort="medium"', "-"]
  luna-reviewer:
    adapter: host
    model: gpt-5.6-luna
    reasoning_effort: medium
    agent_type: reviewer
    fallback_command: [codex, exec, --model, gpt-5.6-luna, --sandbox, workspace-write, -c, 'model_reasoning_effort="medium"', "-"]
  luna-judge:
    adapter: host
    model: gpt-5.6-luna
    reasoning_effort: medium
    agent_type: judge
    fallback_command: [codex, exec, --model, gpt-5.6-luna, --sandbox, workspace-write, -c, 'model_reasoning_effort="medium"', "-"]
  terra-worker:
    adapter: host
    model: gpt-5.6-terra
    reasoning_effort: medium
    agent_type: worker
    fallback_command: [codex, exec, --model, gpt-5.6-terra, --sandbox, workspace-write, -c, 'model_reasoning_effort="medium"', "-"]
  terra-reviewer:
    adapter: host
    model: gpt-5.6-terra
    reasoning_effort: medium
    agent_type: reviewer
    fallback_command: [codex, exec, --model, gpt-5.6-terra, --sandbox, workspace-write, -c, 'model_reasoning_effort="medium"', "-"]
  terra-judge:
    adapter: host
    model: gpt-5.6-terra
    reasoning_effort: medium
    agent_type: judge
    fallback_command: [codex, exec, --model, gpt-5.6-terra, --sandbox, workspace-write, -c, 'model_reasoning_effort="medium"', "-"]
  sol-worker:
    adapter: host
    model: gpt-5.6-sol
    reasoning_effort: high
    agent_type: worker
    fallback_command: [codex, exec, --model, gpt-5.6-sol, --sandbox, workspace-write, -c, 'model_reasoning_effort="high"', "-"]
  sol-reviewer:
    adapter: host
    model: gpt-5.6-sol
    reasoning_effort: high
    agent_type: reviewer
    fallback_command: [codex, exec, --model, gpt-5.6-sol, --sandbox, workspace-write, -c, 'model_reasoning_effort="high"', "-"]
  sol-judge:
    adapter: host
    model: gpt-5.6-sol
    reasoning_effort: high
    agent_type: judge
    fallback_command: [codex, exec, --model, gpt-5.6-sol, --sandbox, workspace-write, -c, 'model_reasoning_effort="high"', "-"]
  codex-cli:
    adapter: command
    command: [codex, exec, "-"]
    model: codex-cli
  claude-cli:
    adapter: command
    command: [claude, -p]
    model: claude-cli
  grok-cli:
    adapter: command
    command: [grok, build, "-"]
    model: grok-cli

loadouts:
  native:
    worker: native-worker
    reviewer: native-reviewer
    judge: native-judge
  luna:
    worker: luna-worker
    reviewer: luna-reviewer
    judge: luna-judge
  terra:
    worker: terra-worker
    reviewer: terra-reviewer
    judge: terra-judge
  sol:
    worker: sol-worker
    reviewer: sol-reviewer
    judge: sol-judge
  codex:
    worker: codex-cli
    reviewer: codex-cli
    judge: codex-cli
  claude:
    worker: claude-cli
    reviewer: claude-cli
    judge: claude-cli
  grok-worker:
    worker: grok-cli
    reviewer: grok-cli
    judge: grok-cli

default_loadout: native

# Direct bindings remain available for repo-native compatibility. Loadout
# slots win for archetyped roles; an explicit role binding still wins first.
bindings:
  "*": native-worker
