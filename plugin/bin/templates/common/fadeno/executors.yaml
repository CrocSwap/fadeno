# Fadeno's bundled executor catalog. This is intentionally conservative:
# native is the safe default and command adapters are only used after an
# explicit loadout selection. User ~/.config/fadeno/executors.yaml and a
# project .fadeno/executors.yaml may override entries by name.
executors:
  native-worker:
    adapter: host
    model: current-host
    reasoning_effort: default
    agent_type: worker
  native-reviewer:
    adapter: host
    model: current-host
    reasoning_effort: default
    agent_type: reviewer
  native-judge:
    adapter: host
    model: current-host
    reasoning_effort: default
    agent_type: judge
  codex-cli:
    adapter: command
    command: [codex, exec, "-"]
    model: codex-cli
  claude-cli:
    adapter: command
    command: [claude, -p]
    model: claude-cli
  grok-cli:
    adapter: command
    command: [grok, build, "-"]
    model: grok-cli

loadouts:
  native:
    worker: native-worker
    reviewer: native-reviewer
    judge: native-judge
  codex:
    worker: codex-cli
    reviewer: codex-cli
    judge: codex-cli
  claude:
    worker: claude-cli
    reviewer: claude-cli
    judge: claude-cli
  grok-worker:
    worker: grok-cli
    reviewer: grok-cli
    judge: grok-cli

default_loadout: native

# Direct bindings remain available for repo-native compatibility. Loadout
# slots win for archetyped roles; an explicit role binding still wins first.
bindings:
  "*": native-worker
